name: Lore Validate

on:
  push:
    branches: [dev, main]
    paths:
      - 'lore/**'
      - '.github/workflows/lore-validate.yml'
  pull_request:
    paths:
      - 'lore/**'
      - '.github/workflows/lore-validate.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # zero-dependency engine: no install step, the suite IS the spec
      - name: Run test suite
        run: npm test

      - name: Syntax-check engine and hook scripts
        run: |
          for f in scripts/mine-skills.mjs scripts/lib/*.mjs scripts/hooks/*.mjs; do
            node --check "$f"
          done
