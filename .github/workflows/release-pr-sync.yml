name: release-pr-sync

# Keeps a standing "Release dev to main" PR whose body is a synthesized summary
# of everything on dev that is not yet on main. Ported from stoa/specstory-sync
# (release-pr-sync + release-pr-body), with the agentic body rewrite running on
# anthropics/claude-code-action (Claude subscription auth) instead of gh-aw.
#
# This PR is the human-facing audit view for the provider factory's autonomous
# merges into dev (DEPENDENCY-UPDATE): the body enumerates each factory-merged
# dependabot PR with its verdict and links its assessment.
#
# Guardrail shape: the agent step writes only out/body.md; a mechanical step
# applies it with `gh pr edit`. The agent holds no write credential.

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    # Session histories and work threads never change the release story.
    paths-ignore:
      - "**/.specstory/**"
      - "workthreads/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  ensure-release-pr:
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.diff.outputs.should_update }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main and dev refs
        run: git fetch origin main dev --no-tags --depth=200

      - name: Determine whether main is behind dev
        id: diff
        run: |
          AHEAD_COUNT="$(git rev-list --count --no-merges origin/main..origin/dev)"
          echo "ahead_count=${AHEAD_COUNT}" >> "$GITHUB_OUTPUT"
          if [[ "${AHEAD_COUNT}" -gt 0 ]]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          fi
          echo "dev is ${AHEAD_COUNT} non-merge commits ahead of main"

      - name: Find or create dev -> main release PR
        id: pr
        if: steps.diff.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING_PR="$(gh pr list --repo "${REPO}" --base main --head dev --state open --json number --jq '.[0].number // ""')"
          if [[ -n "${EXISTING_PR}" ]]; then
            echo "Found existing PR #${EXISTING_PR}"
            echo "pr_number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_URL="$(gh pr create \
            --repo "${REPO}" \
            --base main \
            --head dev \
            --title "Release dev to main" \
            --body "Generating release summary...")"
          PR_NUMBER="${PR_URL##*/}"
          echo "Created PR #${PR_NUMBER}"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

  rewrite-body:
    needs: ensure-release-pr
    if: needs.ensure-release-pr.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # claude-code-action's OAuth auth exchanges a GitHub OIDC token
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main and dev refs
        run: git fetch origin main dev --no-tags --depth=200

      - name: Build release PR context
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/ci/build-release-pr-context.sh origin/main origin/dev out/context.md

      # Credential-less beyond its own auth; writes only out/body.md.
      - name: Write release summary (agent)
        uses: anthropics/claude-code-action@781d62e9d5fbd78b24dcdfd42858332d485fe462 # v1 (2026-09-01)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pushes to dev made by the factory's merges arrive as our App's bot identity.
          allowed_bots: "provider-factory"
          claude_args: '--max-turns 80 --allowedTools "Bash,Read,Write,Grep,Glob"'
          prompt: |
            Write the body of release pull request #${{ needs.ensure-release-pr.outputs.pr_number }}
            so it reflects the **current total accumulated diff from `main` to `dev`** of this
            repository (${{ github.repository }}). Do not summarize only the latest push: this is a
            full release summary of everything on dev that is not yet on main.

            ## Sources, in order
            1. out/context.md — the canonical scope: commit range, changelog lines added, changed
               design docs, factory-merged dependency PRs (with verdict + assessment link), commits,
               files changed.
            2. The checkout itself: `git diff origin/main..origin/dev -- <path>` for anything you
               need to understand; `specstory-cli/changelog.md` and `specstory-cli/docs/*.md` for
               the maintainers' own descriptions.
            Do not speculate beyond what the range and touched docs support.

            ## Body structure
            1. A short opening paragraph summarizing the release (what kind of release this is,
               size of the range).
            2. `## Highlights` — 3–6 concise bullets for the most important changes.
            3. `## Major Change Areas` — related work grouped into themes; a short paragraph or a
               few bullets per theme. Provider work (specstory-cli/pkg/providers/*) is usually its
               own theme per provider.
            4. `## Dependency Updates` — one line per factory-merged dependabot PR from the
               context: `#N dependency old → new — verdict — [assessment](link)`. Do not re-derive
               impact; the linked assessment is the record. If none, say so.
            5. `## Operational Notes` — release/deploy implications, config changes, platform
               caveats (three-platform support: macOS, Linux, Windows), follow-up validation, or
               risks. If none are notable, say that explicitly.
            6. `## Commits` — compact bullet list of non-merge commits, grouped by theme when
               possible.

            ## Style
            Optimize for a human reviewing a release PR. Be specific; avoid changelog spam; prefer
            synthesis over repeating every subject line. Mention docs, migration, or infra changes
            when they matter operationally.

            ## Output
            Write the complete markdown body to out/body.md and nothing else. Do not edit any
            tracked file, do not post, do not touch the PR — a following step applies your file.

      - name: Apply body to the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.ensure-release-pr.outputs.pr_number }}
        run: |
          test -s out/body.md || { echo "::error::agent produced no out/body.md"; exit 1; }
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" --body-file out/body.md
          echo "Release PR #${PR_NUMBER} body updated ($(wc -l < out/body.md) lines)"
