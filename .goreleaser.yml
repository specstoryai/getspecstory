version: 2

project_name: SpecStoryCLI

# Builds are split by OS family only so archives can differ per platform:
# Unix ships both tar.gz and zip (long-standing dual-format convention),
# Windows ships zip only (the platform convention).
builds:
  - id: unix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: specstory
    main: ./main.go
    dir: ./specstory-cli
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/specstoryai/getspecstory/specstory-cli/pkg/analytics.apiKey={{.Env.POSTHOG_API_KEY}}
  - id: windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    binary: specstory
    main: ./main.go
    dir: ./specstory-cli
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/specstoryai/getspecstory/specstory-cli/pkg/analytics.apiKey={{.Env.POSTHOG_API_KEY}}

archives:
  # tar.gz for Unix only — Homebrew and install.sh consume these.
  - id: targz
    ids: [unix]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - none*
  # zip for every platform — the only Windows format, and a Unix alternative.
  - id: zip
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - none*
