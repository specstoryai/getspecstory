name: SpecStory
options:
  bundleIdPrefix: com.specstory
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: "-"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  SpecStoryKit:
    path: SpecStoryKit
targets:
  SpecStory:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: SpecStoryKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specstory.mac
        PRODUCT_NAME: SpecStory
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/SpecStory.entitlements
        ENABLE_HARDENED_RUNTIME: "NO"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  SpecStory:
    build:
      targets:
        SpecStory: all
    run:
      config: Debug
